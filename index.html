<!doctype html>
<html lang="de" data-theme="hell">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Durch</title>
  <meta name="description" content="Persönlicher Übungsweg für den Umgang mit Angst.">
  <meta name="theme-color" content="#F6F2EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Durch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">
  <script>
    // Theme früh setzen, damit nichts aufblitzt
    try {
      var c = JSON.parse(localStorage.getItem('durch:doc:einstellungen') || '{}');
      if (c.theme) document.documentElement.dataset.theme = c.theme;
    } catch (e) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="inhalt" class="haupt"></main>
  <button type="button" id="hilfe-btn" class="hilfe-btn" aria-haspopup="dialog">Hilfe</button>

</body>
</html>
